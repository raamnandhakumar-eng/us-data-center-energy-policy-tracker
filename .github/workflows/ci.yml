name: CI

on:
  push:
    branches:
      - main
      - feat/gridpolicy-mvp
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Runtime smoke test
        shell: bash
        run: |
          npm run start > /tmp/gridpolicy-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /tmp/gridpolicy-home.html; then
              break
            fi
            sleep 1
          done

          test -s /tmp/gridpolicy-home.html
          grep -q "GridPolicy" /tmp/gridpolicy-home.html

          curl -fsS             -X POST             -H "Content-Type: application/json"             -d '{"id":"florida-fpl-llcs"}'             http://127.0.0.1:3000/api/analyze > /tmp/gridpolicy-api.json

          grep -q '"humanReviewRequired":true' /tmp/gridpolicy-api.json
          grep -q '"claimBindings"' /tmp/gridpolicy-api.json
